[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=NetDot X
Information=Ping dot to the nearest Cloudflare server. 1.1.1.1 is anycast, so the network already routes it to the closest Cloudflare data center (follows laptops, friends' PCs, VPNs). Every 10 min it checks which data center that is and briefly shows the code if it changed. Falls back to 1.0.0.1 if 1.1.1.1 is blocked.

[Variables]
GoodLatency=100
BadLatency=300
PingHost=1.1.1.1
AltHost=1.0.0.1
; how often to check which Cloudflare data center you reach (seconds)
TraceInterval=600
; how long the data-center code stays next to the ping after it changes (seconds)
ColoFlashSeconds=30

[MeasurePing]
Measure=Plugin
Plugin=PingPlugin
DestAddress=#PingHost#
UpdateRate=1
Timeout=1000
TimeoutValue=-1

; Asks Cloudflare which data center answered ("colo=MIA"). One small request per TraceInterval.
[MeasureTrace]
Measure=WebParser
URL=https://#PingHost#/cdn-cgi/trace
RegExp=(?siU)colo=([A-Z]+)\n
StringIndex=1
UpdateRate=#TraceInterval#
FinishAction=[!CommandMeasure MeasureNet "OnTrace()"]
OnConnectErrorAction=[]
OnRegExpErrorAction=[]
LogSubstringErrors=0

; Turns the ping into color/text, handles host fallback and the data-center notice.
[MeasureNet]
Measure=Script
ScriptFile=#@#NetDot.lua

[MeterStatusDot]
Meter=Shape
Shape=Ellipse 20,15,5,5 | Fill Color 128,128,128,255 | StrokeWidth 0

[MeterPingText]
Meter=String
Text=Ping: ...
FontFace=Segoe UI
FontSize=10
FontColor=230,230,230,255
AntiAlias=1
X=30
Y=5
